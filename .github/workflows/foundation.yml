name: Foundation

on:
  pull_request:
  push:

jobs:
  swift-packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: swift test --package-path Packages/MarketplaceFoundation
      - run: swift test --package-path Packages/MarketplaceDesignSystem
      - run: swift test --package-path Packages/MarketplaceInfrastructure
      - run: swift test --package-path Packages/DastakDomain
      - run: swift package dump-package --package-path Packages/SavariDomain >/dev/null
      - run: |
          if grep -R -n -E 'DastakDomain' Packages/SavariDomain \
            || grep -R -n -E 'SavariDomain' Packages/DastakDomain; then
            echo "Product domain packages must not depend on one another." >&2
            exit 1
          fi

  dastak-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/MarketplaceWeb/package-lock.json
      - run: scripts/test-dastak-web.sh

  savari-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backends/Savari
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.90.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2
      - run: supabase start
      - run: supabase db reset --local
      - run: ../../scripts/test-backend-security.sh Savari --local
      - run: deno test --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen --allow-env supabase/functions/tests/
      - run: deno test --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen --allow-read supabase/tests/database/
      - run: find supabase/functions -name '*.ts' -print0 | xargs -0 deno check --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen
      - run: deno fmt --config supabase/functions/deno.json --check supabase/functions supabase/tests/database
      - if: always()
        run: supabase stop --no-backup

  dastak-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backends/Dastak
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.90.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2
      - run: supabase start
      - run: supabase db reset --local
      - run: ../../scripts/test-backend-security.sh Dastak --local
      - run: supabase test db
      - run: scripts/test-v1-batch1-concurrency.sh
      - run: scripts/test-v1-wave1-concurrency.sh
      - run: deno test --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen --allow-env supabase/functions/tests/
      - run: deno test --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen --allow-read supabase/tests/database/
      - run: find supabase/functions -name '*.ts' -print0 | xargs -0 deno check --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen
      - run: deno fmt --config supabase/functions/deno.json --check supabase/functions supabase/tests/database
      - if: always()
        run: supabase stop --no-backup

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: |
          for scheme in Savari SavariAdmin; do
            xcodebuild \
              -workspace SavariDastak.xcworkspace \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          done
      - run: scripts/test-dastak-ios.sh
