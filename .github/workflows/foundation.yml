name: Foundation

on:
  pull_request:
  push:

jobs:
  swift-packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: swift test --package-path Packages/MarketplaceFoundation
      - run: swift test --package-path Packages/MarketplaceInfrastructure
      - run: swift package dump-package --package-path Packages/SavariDomain >/dev/null
      - run: swift package dump-package --package-path Packages/DastakDomain >/dev/null
      - run: |
          if grep -R -n -E 'DastakDomain' Packages/SavariDomain \
            || grep -R -n -E 'SavariDomain' Packages/DastakDomain; then
            echo "Product domain packages must not depend on one another." >&2
            exit 1
          fi

  savari-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backends/Savari
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.90.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db test supabase/tests/database/001_identity.pgtap.sql --local
      - run: supabase db test supabase/tests/database/002_security_audit_zones.pgtap.sql --local
      - run: supabase db query --local --file ../../scripts/assert-no-client-dml.sql
      - run: deno test --allow-env supabase/functions/tests/
      - run: deno test --allow-read supabase/tests/database/
      - run: find supabase/functions -name '*.ts' -print0 | xargs -0 deno check
      - run: deno fmt --check supabase/functions supabase/tests/database
      - if: always()
        run: supabase stop --no-backup

  dastak-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backends/Dastak
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.90.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db test supabase/tests/database/001_identity.pgtap.sql --local
      - run: supabase db test supabase/tests/database/002_security_audit_zones.pgtap.sql --local
      - run: supabase db query --local --file ../../scripts/assert-no-client-dml.sql
      - run: deno test --allow-env supabase/functions/tests/
      - run: deno test --allow-read supabase/tests/database/
      - run: find supabase/functions -name '*.ts' -print0 | xargs -0 deno check
      - run: deno fmt --check supabase/functions supabase/tests/database
      - if: always()
        run: supabase stop --no-backup

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: |
          for scheme in Savari SavariAdmin Dastak DastakMerchant DastakAdmin; do
            xcodebuild \
              -workspace SavariDastak.xcworkspace \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          done
