services:
  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/razorpayx-payout-gateway/Dockerfile
    environment:
      PORT: "8080"
      DASTAK_PAYOUT_GATEWAY_SECRET: ${DASTAK_PAYOUT_GATEWAY_SECRET:?required}
      DASTAK_PAYOUT_GATEWAY_MAX_CLOCK_SKEW_SECONDS: ${DASTAK_PAYOUT_GATEWAY_MAX_CLOCK_SKEW_SECONDS:-120}
      DASTAK_PAYOUT_GATEWAY_REPLAY_STORE: /var/lib/dastak-payout-gateway/replay.jsonl
      RAZORPAYX_MODE: ${RAZORPAYX_MODE:?required}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:?required}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:?required}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:?required}
      RAZORPAYX_LIVE_EGRESS_ALLOWLIST_CONFIRMED: ${RAZORPAYX_LIVE_EGRESS_ALLOWLIST_CONFIRMED:-false}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - payout-replay:/var/lib/dastak-payout-gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DASTAK_PAYOUT_GATEWAY_HOSTNAME: ${DASTAK_PAYOUT_GATEWAY_HOSTNAME:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  payout-replay:
  caddy-data:
  caddy-config:
